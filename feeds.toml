# Shared SM8250 / kona layer: GICv3 and timer description, the two SoC XNU
# patches (native-smp-secondary, native-smp-type-clusters) and the SoC config
# fragment. Same pin alioth qualified on 17.7.11.
[[source]]
name = "sm8250"
kind = "soc"
git = "https://github.com/FFT-infra/UniXNU-sm8250-common"
commit = "a6e7e36caab58f5b9a5625dbdb8da2bf290fa5cc"

# ArmCpu fork with the SM8250 bring-up alioth measured: the SPI-IPI base is
# derived from GICD_TYPER instead of the fixed 1008 (kona's DT uses SPIs up to
# 863) and the timer INTID is overridable. The base component keeps the fixed
# value and would route IPIs into the wrong INTIDs on this SoC.
[[source]]
name = "ArmCpu"
kind = "driver"
git = "https://github.com/xVanTuring/ArmCpu"
commit = "a9c4585dbb1b75b8594dd0ae54962cc59969d98f"

