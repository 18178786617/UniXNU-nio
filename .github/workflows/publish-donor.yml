name: Publish the donor kernelcache

# Publishes the arm64 slice of the iOS 16.5 kernelcache as a release asset.
#
# The restore image is not redistributable, and the kernelcache is Apple's
# kernel in Apple's image, so it is not redistributed either. What is published
# is the same bytes the prelink step consumes, and the release asset carries
# the sha256 that board.toml pins, so the build can check it.
#
# The bytes come from a machine that has the image; this workflow does not
# download one. It uploads what it is given, verifies the digest against
# board.toml's pin, and refuses to publish anything that does not match.
#
# The upload is deliberately a separate workflow rather than a step of the
# kernel build: the kernel build runs on every push, and the donor does not
# change with the kernel. Publishing it once means there is a stable URL for
# the donor, next to the one the kernel build reads from the repository.
#
# The kernel build does not depend on this workflow: it reads the donor from
# the repository's donor/ directory. This workflow is for the releases page.

on:
  workflow_dispatch:
    inputs:
      source:
        description: >-
          Path of the gzipped arm64 slice, relative to the repository root. The
          file has to be named kernelcache.decompressed.gz.
        required: false
        default: "donor/kernelcache.decompressed.gz"
      tag:
        description: Release tag to publish under
        required: false
        default: "donor-16.5"
  # A new donor under donor/ publishes itself.
  push:
    branches: [main]
    paths:
      - "donor/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the device repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the donor against board.toml's pin
        id: check
        run: |
          set -euo pipefail
          source_file="${{ inputs.source || 'donor/kernelcache.decompressed.gz' }}"
          echo "source: $source_file"
          if [ ! -f "$source_file" ]; then
            echo "::error::no such file: $source_file"
            exit 1
          fi
          pin=$(python3 -c "import tomllib;print(tomllib.load(open('board.toml','rb'))['kernel']['prelink']['kernelcache_sha256'])")
          echo "pin: $pin"
          gzip -t "$source_file"
          gzip -dc "$source_file" > "$RUNNER_TEMP/kernelcache.decompressed"
          got=$(sha256sum "$RUNNER_TEMP/kernelcache.decompressed" | cut -d' ' -f1)
          echo "sha256: $got"
          if [ "$got" != "$pin" ]; then
            echo "::error::the donor does not match board.toml's pin ($pin)"
            exit 1
          fi
          echo "the donor matches the pin"
          cp "$source_file" "$RUNNER_TEMP/kernelcache.decompressed.gz"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'donor-16.5' }}
        run: |
          set -euo pipefail
          # The release may already exist from an earlier run; the asset is
          # replaced rather than duplicated.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/kernelcache.decompressed.gz" --clobber
            echo "updated the release $TAG"
          else
            gh release create "$TAG" "$RUNNER_TEMP/kernelcache.decompressed.gz" \
              --title "Donor kernelcache (iOS 16.5, arm64 slice)" \
              --notes "The arm64 slice of the iOS 16.5 (20F66) kernelcache, gzipped.

          sha256 of the uncompressed slice: $(sha256sum "$RUNNER_TEMP/kernelcache.decompressed" | cut -d' ' -f1)

          This is the donor the prelink step binds against, and its digest is
          the one board.toml pins. The kernel build fetches it from here and
          checks the digest before it uses it."
            echo "created the release $TAG"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## donor kernelcache"
            echo
            echo "- tag: \`${{ inputs.tag || 'donor-16.5' }}\`"
            echo "- asset: \`kernelcache.decompressed.gz\`"
            echo "- sha256 of the slice: \`$(sha256sum "$RUNNER_TEMP/kernelcache.decompressed" 2>/dev/null | cut -d' ' -f1 || echo '<not produced>')\`"
          } >> "$GITHUB_STEP_SUMMARY"
