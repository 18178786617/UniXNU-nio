name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and
# uefi checkouts beside it, the layout board.toml names. The platform seed comes
# from the repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images,
# so the run's artifacts belong to one device alone: download them, then delete
# the run.
#
# nio adaptation notes (vs UniXNU-sheng's package.yml):
# - The board builds the iOS 16.5 OS profile (ios-16.5-20F66, xnu-8796), not
#   an iPadOS one; the 27 Data-seed cache/backup machinery does not apply.
# - The restore image is not redistributable, so [ipsw].url names the member
#   rather than a URL. Point the run at a local copy with the ipsw_url input
#   or UNIXNU_IPSW.
# - UniXNU is pinned to 04573c510c5fd4892ca6948739389141cc9e05f5, the same
#   revision source-lock.json and the kernel.yml workflow use, so every run
#   resolves the same feeds and unixnu.lock.
# - The uefi checkout is nio's own Silicium tree (source-lock.json
#   "uefi-umi": 48bc4121...), NOT an official uefi-nio repository: there is no
#   official kona firmware package yet. Set the uefi_repository input to the
#   GitHub repository that carries that tree before running. Until the firmware
#   step is wired into this repository (nioPkg INFs still live with the local
#   bring-up tools), a full `release` run may stop at the firmware step; the
#   kernel and payload artifacts of earlier steps are still uploaded.
# - Runner defaults to macos-26, the image upstream validates the pipeline on.
#   Switch to macos-15-intel only if Xcode rejects warning flags (see
#   docs/BUILD-GITHUB.md for the difference).

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["17"]
        default: "17"
      runner:
        description: "Runner image (macos-26 = arm64 official; macos-15-intel = x86_64 fallback)"
        type: choice
        options: ["macos-26", "macos-15-intel"]
        default: "macos-26"
      uefi_repository:
        description: "GitHub repository carrying the nio uefi tree (org/name)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 04573c510c5fd4892ca6948739389141cc9e05f5 # source-lock.json pin
          path: UniXNU
          submodules: recursive
      - name: uefi checkout
        if: inputs.uefi_repository != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.uefi_repository }}
          ref: 48bc41218c480519bfd299c22205f44e418df9d0 # source-lock.json pin
          path: uefi-nio
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before the long build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            echo 'nio uses 8 hex digits (board.toml [payload.adt] unique_chip_id = "required");' >&2
            echo 'the same seed must match the one used for any previously generated kernel.macho.adt.' >&2
            exit 1
          fi
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE")
          if [ -n "${{ inputs.uefi_repository }}" ]; then
            args+=(--uefi ../uefi-nio)
          fi
          scripts/package.sh "${args[@]}"
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            UniXNU/out/nio/*/*/boot/boot.img
            UniXNU/out/nio/*/*/payload/payload.img
            UniXNU/out/nio/*/*/kernel/kernel.macho
            UniXNU/out/nio/*/*/package.manifest.json
      - name: logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            UniXNU/out/nio/**/*.log
            UniXNU/out/nio/*/*/status.txt
