version = 1

# Menu the payload volume ships for UniXNU. It sits at \EFI\UniXNU\unixnu.toml
# because that is the only path the loader reads.

[boot]
# timeout=0: boot the default entry at once, no menu countdown (Internal.h: <0 waits, 0 boots at once).
timeout = 0
default = "xnu"

[ui]
title = "Edge S - UniXNU iPadOS 17.7.11 (21H461)"

[[entry]]
id = "xnu"
title = "iPadOS 17.7.11 kernel (xnu-10063.141.1)"
type = "xnu"
# Supplied by the packer once a kernel.macho exists; until then this entry is
# the placeholder that proves the menu and the file path are wired.
path = "Payloads/kernel.macho"
# initrd: the packed APFS Data seed, not the root. The 21H461 kernel now owns
# the real root through NioUfs: /chosen/root-matching selects the OS volume in
# the SHNGROOT image on UFS LUN 4, and the writable Data volume comes from the
# DBRDISK1 ramdisk below. DarwinBoot still needs an initrd entry to fill the
# ADT /chosen/memory-map PackedRAMDisk placeholder; make-payload-vol.sh checks
# that the two agree before it writes the volume.
initrd = "Payloads/scratch-data.img"
# amfi_get_out_of_my_way=1: the standard AMFI bypass boot-arg (rmx1971 device
# record uses it too); launchd has no code signature and AMFI would otherwise
# refuse it.
#
# nio_skip_security_extensions=1: run 43's kernel panicked inside
# KLDBootstrap::loadSecurityExtensions, i.e. while loading AMFI, with
# "failed to get mix-n-match policy: 2". AMFI's start() asks img4 for that
# policy and img4 reads /chosen/manifest-properties, a node iBoot writes and
# that a hand-built ADT does not have. amfi_get_out_of_my_way cannot help:
# the panic happens before AMFI reads that argument. The kernel patch of the
# same name makes the bootstrap skip the load when this is present.
args = "keepsyms=1 kt_fixed_zones=120 native-ufs-root=1 j716f-usb=1 native-ufs-allow-unverified=1 root-unverified=1 sheng-data-persist=2 sheng-smp=1 armcpu-self-ipi=1 armcpu-spi-ipi=1 nio-gpu=9 nio-root-lba=58840832 native-ufs-stream=0xe0 native-ufs-stream2=0x4e0 offline-apfs-load=1 -apfs_shared_datavolume panic_on_crash_disabled=1 amfi_get_out_of_my_way=1 amfi_allow_any_signature=1 nio_skip_security_extensions=1 unentitled_ios_sim_launch=1 ignition_level=1 sheng-disable-watchdogd=1 wdt=-1 offline-mobile-graphics-load=1 offline-legacy-register=1 offline-legacy-phase=4 offline-legacy-gop=1 offline-legacy-unit-scale=2 offline-legacy-pm=1 offline-legacy-validate=1 offline-legacy-transfer=1 offline-legacy-cpu-present=1 sheng-vsync=60 sheng-vsync-fixed=1"

# No rd=md0: the root is the OS volume NioUfs publishes from userdata. No
# debug=0x1 or startup_debug=1: those are DB_HALT and wait for a debugger that
# will never attach. panic_on_crash_disabled=1 keeps a crashing daemon from
# panicking the whole kernel during bring-up, the same bring-up argument the
# official alioth port uses. -apfs_shared_datavolume lets keybagd accept a
# Data volume with no hardware keybag, which is this board's situation.

[[entry]]
id = "tools"
title = "UniXNU tools (menu test)"
type = "action"
action = "tools"

