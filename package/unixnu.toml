version = 1

# Menu the payload volume ships for UniXNU. It sits at \EFI\UniXNU\unixnu.toml
# because that is the only path the loader reads.

[boot]
timeout = 3
default = "xnu"

[ui]
title = "Edge S - UniXNU iOS 16.5"

[[entry]]
id = "tools"
title = "UniXNU tools (menu test)"
type = "action"
action = "tools"

[[entry]]
id = "xnu"
title = "iOS 16.5 kernel"
type = "xnu"
# Supplied by the packer once a kernel.macho exists; until then this entry is
# the placeholder that proves the menu and the file path are wired.
path = "Payloads/kernel.macho"
# initrd: the N4KROOT rootfs image. DarwinBoot copies it into memory and fills
# the ADT /chosen/memory-map RAMDisk placeholder with {base,size}; the kernel's
# memdev then exposes it as md0 and mockfs_mountroot reads the N4KROOT header
# off it. rd=md0 makes IOFindBSDRoot pick that memory device as the root.
#
# STAGE 1 (2026-11-08): the initrd is KEPT on purpose. make-payload-vol.sh
# asserts that the menu's initrd and the device tree's RAMDisk placeholder
# agree; dropping rd=md0 here without regenerating kernel.macho.adt would make
# DarwinBoot refuse this kernel as Compromised Data before it ever runs.
# native-ufs-probe=12 therefore runs the UFS bring-up path ALONGSIDE the RAM
# root: it reports every IOMedia (BSD name, size, UUID) and then panics, which
# is the reading needed to confirm the nio UFS controller can publish blocks.
initrd = "Payloads/rootfs.img"
# amfi_get_out_of_my_way=1: the standard AMFI bypass boot-arg (rmx1971 device
# record uses it too); launchd has no code signature and AMFI would otherwise
# refuse it.
#
# nio_skip_security_extensions=1: run 43's kernel panicked inside
# KLDBootstrap::loadSecurityExtensions, i.e. while loading AMFI, with
# "failed to get mix-n-match policy: 2". AMFI's start() asks img4 for that
# policy and img4 reads /chosen/manifest-properties, a node iBoot writes and
# that a hand-built ADT does not have. amfi_get_out_of_my_way cannot help:
# the panic happens before AMFI reads that argument. The kernel patch of the
# same name makes the bootstrap skip the load when this is present.
args = "-v keepsyms=1 kt_fixed_zones=120 -enable_kprintf_spam native-ufs-root=1 native-ufs-probe=12 rd=md0 amfi_get_out_of_my_way=1 amfi_allow_any_signature=1 nio_skip_security_extensions=1 unentitled_ios_sim_launch=1 ignition_level=1 launchd_unsecure_cache=1"
