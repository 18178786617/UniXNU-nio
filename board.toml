# UniXNU-nio — MOTO Edge S (XT2125-4) / kona / SM8250-AC
#
# The port's target is iOS 16.5 (build 20F66), not iPadOS: the ADT forges an
# iPhone X identity (iPhone10,3 / D22AP), the userland is the iPhone X 16.5
# restore image, and the kernel is the xnu-8796 train (Darwin 22.5.0). The
# user's copy of that image and its extracted root are at E:\nio-unixnu-port\
# ios165\ on the porting host.
#
# The kernel this file builds is the 16.5 one: Darwin 22.5.0, xnu-8796.101.5.
# The switch from the bring-up base -- the iPadOS 17.7.11 kernel that reached
# the console with its donor, its prelink bindings and its patch series all
# verified, and that linked for the first time in R120 -- is the three steps
# UniXNU-NX769J made on another phone:
#
#   1. the OS profile, kept in this repository (os-profiles/ios-16.5-20F66/)
#      and installed into the UniXNU checkout before the build;
#   2. the patch series, rebased onto xnu-8796.101.5
#      (patches/xnu-8796/, verified to apply in order on the real tree);
#   3. this file, which names the profile and carries the 16.5 donor, the
#      prelink bindings and the ADT identity.
#
# NX769J is an SM8550 board. This one is SM8250, so the series carries the
# SM8250 two-cluster scheduler patch that NX769J does not have, and the
# board-level values below (memory window, kernel arguments, the display and
# GPU switches) are nio's own and unchanged by the switch.
#
# schema_version 2 means the kernel is built by the shared pipeline:
#   arch profile -> SoC profile -> OS profile -> this file
# which is the only form that applies a patch series and is reproducible on a
# clean clone (see .github/workflows/kernel.yml).
schema_version = 2

[board]
name = "nio"
soc = "SM8250"
# UniXNU-sm8250-common: GIC/timer/topology patches, pinned in feeds.toml.
soc_source = "sm8250"
# The port's target. iOS 16.5 (build 20F66), Darwin 22.5.0, xnu-8796.101.5.
# The ADT forges an iPhone X identity (iPhone10,3 / D22AP) and the userland is
# the iPhone X 16.5 restore image, whose members are extracted on the porting
# host under E:\nio-unixnu-port\ios165\.
#
# The profile lives in this repository (os-profiles/ios-16.5-20F66/) rather
# than upstream, and the build workflow installs it into the UniXNU checkout
# before the configuration is resolved. scripts/unixnu/feeds.py:69-78 reads
# this profile and overrides the xnu source it declares: the ref becomes
# xnu-8796.101.5, the commit becomes aca3beaa3dfbd42498b42c5e5ce20a938e6554e5,
# darwin becomes 22.5.0, and the driverkit and trustcache tags follow. So the
# feeds.toml xnu pin is the 17.7.11 one and this line is what moves the whole
# build onto the 16.5 train.
#
# This is the third of the three steps UniXNU-NX769J made on another phone
# (the profile above, the rebased patch series below, and this line). NX769J is
# an SM8550 board; this one is SM8250, and the difference is in the series:
# patches/xnu-8796/ carries the SM8250 two-cluster scheduler patch as well.
os_profile = "ios-16.5-20F66"
description = "MOTO Edge S (XT2125-4) / SM8250-AC UniXNU bring-up"
kit = "nio"

[components]
# First-light set only. This produces a kernel that can enter, take its timer
# and start secondary cores; storage, display and GPU are added once the boot
# reaches the console. DarwinBoot/GopFramebuffer are firmware/embedded and are
# not compiled here.
#
# ArmSmmu4K, AdrenoPM4 and AdrenoFirmware are the GPU's three upstream kits.
# They are "embedded" kits (build_stage = embedded, no build of their own), so
# selecting them adds no archive and no second copy: it only makes the tree
# carry their sources at kits/<name>, where scripts/build-adreno650.py compiles
# them into the board's GPU archive. Without them the recipe has no input.
#
# NioUfs is the board's UFS transport, and it has to be named here as well as
# in [kernel].archives below. The two lists do different jobs: this one is what
# the configuration selects (scripts/unixnu/components.py:selected walks it),
# and the archives list is what gets built. An archive entry naming a component
# that was never selected is not ignored -- archive_plan raises
# "[kernel] archives: component NioUfs is not selected" and the whole kernel
# build stops at that line, before a single file is compiled. Runs 29 and 30
# ended exactly there: "component:NioUfs" had been added to the archives list
# when the UFS path was turned on, and this list was not.
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "ArmSmmu4K", "AdrenoPM4", "AdrenoFirmware", "NioUfs", "VerifiedRoot"]

[kernel]
defconfig = "nio_defconfig"
# Same fragment order as alioth (SM8250, same OS profile). The device defconfig
# is applied last, so every nio override below wins.
#
# The OS fragment is the 16.5 profile's own ios.config, not the 17.7.11
# profile's ipados.config. The two differ in one line: the 16.5 fragment does
# not set CONFIG_XNU_SOURCE_MOCKFS. This board's defconfig does set it, and
# that is deliberate and unchanged -- mockfs is what mounts the N4KROOT image
# off the RAMDisk memory device as the root filesystem, and without it the boot
# stops at "Failed to mount root device" (R54 measured that). The 8796 series
# below carries the five mockfs patches, so mockfs is buildable on this train.
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ios.config"]
# The whole series lives in this repository, rebased onto xnu-8796.101.5.
#
# The shared arch and soc series still target xnu-10063.141.1, so referencing
# them here would abort `unixnu status` with "patch missing" or fail during
# patch application. patches/xnu-8796/series holds the resolved order on
# 8796.101.5: the ARM64, SoC and OS patches in their original order, the two
# prelink patches XnuPrelink ships only for xnu-10063, this board's GPU probe
# start hook, and the SM8250 two-cluster scheduler patch that NX769J (an
# SM8550 board) does not carry.
#
# The 67 patches were applied, in this order, onto the real xnu-8796.101.5
# tree: none failed, and the result touches 82 files. The check is
# reproducible -- take the tag tarball from Apple's open source distribution,
# git init the tree, and apply the series file in order:
#
#   codeload.github.com/apple-oss-distributions/xnu/tar.gz/refs/tags/xnu-8796.101.5
#
# Two of the 67 are this board's own rather than a rebase of an existing
# patch: the GPU probe start hook (gpu-probe-start.patch) and the SM8250
# two-cluster scheduler (native-smp-type-clusters.patch). One more is not a
# rebase at all but the piece xnu-10063 has and xnu-8796 does not: the
# compile records (xnu-8796-compile-records.patch) the archive builders
# replay. See that patch's own header.
#
# Switch back to
#   ["arch:patches/xnu/series", "soc:patches/xnu/series",
#    "os:patches/xnu/series", "device:patches/xnu/series"]
# once the shared series are rebased, and delete the duplicated copies here.
patch_series = ["device:patches/xnu-8796/series"]
# The arch profile's default archives cover the components selected above.
#
# The GPU archive needs one more recipe, and a list in this file REPLACES the
# arch profile's list (profiles.merge() replaces lists, it does not append),
# so the override below has to repeat the arch profile's eight entries
# verbatim and add build-adreno650.py to them. The pipeline's rule
# (scripts/unixnu/kernel.py archive_plan) is: as soon as one "component:"
# entry is present, every kernel-stage component must be named. This board's
# kernel-stage components are ArmDTPlatform, ArmCpu and SoftwareAES -- the
# three "component:" lines below. The three GPU kits are build_stage =
# "embedded" with no build of their own, so they need no entry of their own;
# selecting them only puts their sources in the tree for the recipe to read.
#
# Keep the eight arch entries in step with profiles/arch/arm64/profile.toml:
# the pipeline refuses the build when a kernel-stage component has no entry.
#
# build-link-stubs.py is the ninth recipe: the GPU archive imports six names
# that no selected component defines, and ld64 refuses to leave a weak_import
# undefined in a static kernel link, so the link needs an answer for each of
# them. The recipe compiles package/LinkStubs.c into
# build/link-stubs/libLinkStubs.a, which reaches the kernel link through
# CONFIG_XNU_EXTRA_LD_ARCHIVES (see configs/nio_defconfig).
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "build-adreno650.py",
  "build-link-stubs.py",
  # The board's UFS driver. build-arm-driver.py compiles it from the
  # device repository's drivers/NioUfs and names the archive after the
  # component id; the kernel link looks for a fixed path, so the second
  # recipe lays the archive down under that name.
  "component:NioUfs",
  "build-nio-ufs-archive.py",
  # The storage base class the UFS driver publishes through. IOBlockStorageDevice
  # is not part of XNU: it ships inside the prelinked IOStorageFamily kext, whose
  # segments the kernel image already carries. Compiling Apple's sources in as
  # well links, and then panics while the kext starts ("class
  # IOApplePartitionScheme is a duplicate; kext __kernel__ already has a class by
  # that name"), because two classes with one name cannot coexist and the kext's
  # copy is the one IOKit instantiates. Runs 40-44 were spent on that detour,
  # including a kernel patch that turned the panic into a log; the patch is gone
  # and the class is not compiled any more.
  #
  # What the driver needs instead is the *original* prelinked code, reached with
  # absolute symbols: scripts/build-storage-bindings.py compiles only
  # IOBlockStorageDevice.cpp (to read the order of its 190 dispatch slots) and
  # writes one .set per slot that lives in the kext, at the address recorded in
  # scripts/prelink-storage-bindings.json. That pin is measured from the donor
  # kernelcache by scripts/pin-prelink-storage.py; see the recipe for why the
  # addresses are stable.
  "build-storage-bindings.py",
  # VerifiedRoot: NioUfs authenticates every root window against an owner-signed
  # bundle, so the link needs the real vr_open, this board's policy table and the
  # trusted key. No bundle has been signed for this phone yet, so the table is
  # generated empty and root verification is disabled rather than approximated
  # (the driver logs which of the two it is doing).
  "build-verified-root.py",
]

# The prelink contract for the 16.5 kernelcache.
#
# The tool is a device wrapper rather than kits/XnuPrelink/emit_prelink.py
# directly: the kit's known-literal-pool catalogue is per kernelcache, and the
# entries it ships with belong to the iPadOS 17.7.11 image. The wrapper verifies
# this kernelcache's Libm coefficient table against the image, records it, and
# runs the kit's own tool unchanged (scripts/emit-prelink-nio.py).
#
# The kernel path is the 16.5 train's own name. xnu-8796 links no
# .unstripped.noctf: its MakeInc.kernel lists five primary outputs and the
# .noctf variant is a later XNU naming. The raw linked kernel carries no CTF
# section, so there is nothing to strip. Pointing at the name xnu-10063 uses
# fails with "not found; run unixnu build kernel first" even after a clean link.
#
# kernelcache_sha256 covers the decompressed arm64 kernelcache Mach-O slice,
# which is what scripts/unixnu/ipsw.py writes to kernelcache.decompressed.
# The pin is the one the ios-16.5-20F66 profile carries.
#
# early_security_init is left unset on purpose. The value would be an unslid
# __TEXT_EXEC address inside AppleMobileFileIntegrity, and identifying it is a
# reversing task, not a field lookup: the 17.7.11 profile's value
# (0xfffffff005ab4ae0) is version bound and must not be copied. With it unset,
# emit_prelink skips that path: AMFI still starts through its ordinary start
# routine, but the pre-lockdown call does not happen.
#
# The roots are the bundle identifiers this kernelcache's __PRELINK_INFO
# actually carries. The 17.7.11 list also kept com.apple.iokit.IOHIDEventDriver,
# which this kernelcache does not contain.
#
# com.apple.iokit.IOStorageFamily has to stay on this list, and for one reason:
# its Info.plist. IOBlockStorageDriver, the partition schemes and
# IOMediaBSDClient reach a new device only through the personalities in it, which
# name their IOClass by bundle; IOService matches a provider against those, and a
# class linked into the kernel cannot carry them. What the kext must *not* do is
# register the classes again -- see scripts/build-storage-bindings.py and the
# [kernel] archives comment above, where the driver's inherited slots are bound
# to this kext's own prelinked code instead of duplicating it.
#
# The `slide` below is what makes that binding portable: it moves the whole
# prelink closure by a fixed amount and leaves the kernel's own text where the
# link put it, which is precisely the rule scripts/pin-prelink-storage.py uses
# when it re-bases the measured pin onto a new image.
[kernel.prelink]
tool = "scripts/emit-prelink-nio.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped"
kernelcache_sha256 = "e6fa75598f47b5a9460a60913e2ac8e4cd6cd60eb475bb31da65b68ffbcfdad5"
slide = "-0x1000000"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
]

[ipsw]
# The target: the iOS 16.5 image (iPhone10,3 / 20F66). The restore image is
# not redistributable, so the URL names the member instead of pointing at
# Apple's CDN; point the build at a local copy with --ipsw or UNIXNU_IPSW.
# The user's copy and its extracted members are on the porting host under
# E:\nio-unixnu-port\ios165\.
url = "iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw"
product = "iPhone10,3"
version = "16.5"
build = "20F66"
device_class = "d22ap"
chip_id = 32789
board_id = 6
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
# Member hashes pinned by member file name. These are the two disk images the
# [userdata] windows consume: OS and Cryptex1,SystemOS. unixnu ipsw fetch
# checks every extracted member against its pin.
#
# The values were measured on the porting host against the extracted members
# of E:\nio-unixnu-port\ios165\ipsw\, and they are the same two the
# ios-16.5-20F66 profile carries.
"096-04088-077.dmg" = "64354ba3475d3c34d6fc531f75585a7b24af0fdb7a3a8a2bdf95c7f351a3f290"
"096-04666-078.dmg" = "2279bf443856fcb6a3f00b1fa06a32ba02a66fdf6ab6b12019462c7498aafdd3"
"kernelcache.release.iphone10b" = "f753edf09be3cf2b21f4dead9deb44809d1f7f0efe8fb94c767ff500dc763fc1"
"096-04088-077.dmg.trustcache" = "df0f60fd05b7c312ad0fddb5c85d8adf97b487e8500518337bc4cbde3ca73ea7"
"096-04666-078.dmg.trustcache" = "501fa23c4620e68e48b91bd2ba8d74251d4fbe37147290650cf717bbef619616"
"DeviceTree.d22ap.im4p" = "51e7e42b74fb5e4cf5c7c1eed30b3d79ec829edfe8c0884c2e7839ddf62a4853"

# userdata lives on LUN 4 (sde). 224.3 GiB raw; the tested-disk size is a
# separate decision and is deliberately not set here.
[userdata]
lun = "sde"
first_lba = 0x308060
last_lba = 0x3b1d7fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

# Firmware is our own nioPkg on Mu-Silicium (build/build-nio.sh), not the
# Xiaomi platform umi uses. UniXNU's firmware-staging stage does not apply.
[firmware]
config = "nio"
dsc = "nioPkg/nio.dsc"
fd = "Build/nioPkg/NOOPT_CLANGDWARF/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}", "{tree}/package", "{edk2}",
  "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium",
]

[firmware.defines]
ENABLE_SECUREBOOT = "0"
DEVICE_MODEL = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "nio-xnu-16.5"

# nio's own boot.img is header v3 (no kernel_offset/tags_offset); ABL decides
# where the payload lands, so the packer only needs the page size.
[bootimg.image]
header_version = 3
pagesize = 4096
base = 0

# Official packaging contract (https://unixnu.com/zh/porting/packaging):
# scripts/package.sh is copied verbatim from the UniXNU templates/ directory and
# reads only the values below. Locally E:\nio-unixnu-port\device\UniXNU is a
# directory junction to ..\..\refs\UniXNU (commit 04573c51... per
# source-lock.json); on GitHub the release workflow checks UniXNU out beside
# this repository, so the same relative path holds in both layouts.
[package]
unixnu = "../UniXNU"

[package.defconfig]
"ios-16.5-20F66" = "nio_defconfig"

[payload]
volume = "NIOXNU"
size_mib = 64
loader = "firmware"
title = "Edge S - XNU bring-up"
# TODO: must equal the measured bank total, not the soldered capacity; umi's
# 12 GiB phone reports 0x2f9900000 after carveouts. nio has no measurement
# yet, so 6 GiB (0x180000000) is the deliberate under-commit: it is safe on
# both the 6 GB and 8 GB Edge S variants, and R43 qualified it up to the
# kernel's first console line. Raise only with a measured bank total.
dram_size = "0x180000000"
panic_screen = false
timeout = -1
# nio-gpu=8 is the GPU probe's mode. Mode 8 is the first one that reaches the
# hardware this phone can already do: it runs the probe's modes 1-7 (read the
# GCC/GPUCC/SMMU state, bring the GMU clocks up, run the A650 cold start with
# the HFI tables built from the AOP command database) and then powers GX
# through the GMU, reading back the GX GDSC, RBBM_STATUS and both GBIF halt
# registers. That is the state R117 measured from the UEFI side on this exact
# phone (GX domain and GX clock on, GD=f8222800, RB=00000001, OI=80000001,
# DB=0c0330db), so it is the first mode with a known-good baseline.
#
# The probe prints its rows through the kernel console, which this board's
# console patch points at the panel: every changed row is printed as
# "GPUROWnn <text>". Modes 9-11 add the first GPU command, the zap shader
# with the GPU interrupt, and the user-client path; they are raised one at a
# time, each with its own image, so a fault is attributable.
# native-ufs-probe=12 is the storage discovery report and it is on for this
# build on purpose. The two volume UUIDs the owner chain keys on --
# root_match_volume_uuid here and XNU_OWNER_CACHE_VOLUME_UUID in the kernel
# patches -- were carried over from the upstream 17.7.11 boards and have
# never been read off this phone. iOS 16.5 ships its restore images
# encrypted, so they cannot be read out of the IPSW either. The report
# waits for IOStorageFamily to publish the root windows, prints every
# IOMedia with its BSD name, size and UUID, and then panics; the panic
# screen is how those two values get measured instead of guessed. Remove it
# once the owner chain is configured with the real ones.
kernel_args = ["-v", "keepsyms=1", "kt_fixed_zones=120", "nio-gpu=8", "native-ufs-root=1", "native-ufs-probe=12", "nio_skip_security_extensions=1"]

["adt"."defaults"."u32"]
# No Apple PMGR or SEP on kona: report a virtual platform so AMFI does not
# wait for an ApplePMGRNub (R48 measured: "AMFI: No PMGR?" panic at
# ConfigurationSettings.cpp:235 from early_security_init). vmm-present backs
# kern.hv_vmm_present; evb10.md documents that watchdogd traps with SIGTRAP
# three times and panics without it, and that sleep-disabled belongs in the
# same table (sheng carries both).
"sleep-disabled" = 1
"vmm-present" = 1

[payload.adt]
# Official ADT generator contract (scripts/make-adt.py -> unixnu/devicetree.py):
# the platform identity only comes from --unique-chip-id on the command line
# ("required" makes both the local and cloud builds refuse to run without it).
chip_id = "0x164"
unique_chip_id = "required"
# R45 measured failure: with 4 GiB the on-device boot returned Out of
# Resources before the kernel ran. AllocateWindow (DarwinBoot.c) scans the
# UEFI memory map for ONE contiguous EfiConventionalMemory run of this size;
# nio's native XBL firmware fragments DRAM with bootloader reservations, so
# no 4 GiB run exists (alioth qualifies 4 GiB only on the hand-tuned UniXNU
# firmware with 36 clean descriptors). 256 MiB is the WINDOW_SIZE fallback
# that R42/R43 proved loadable on this exact firmware.
owned_memory_size = "0x10000000"
packed_data_ramdisk = false
# The APFS volume UUID of the OS window in the userdata image, read out of the
# volume superblock of the image this build writes
# (scripts/extract-root-volume-uuid.py, the copy in refs/UniXNU-nx769j).
# The ADT generator writes it to /chosen/root-matching as an IOKit dictionary
# with IOProviderClass = IOMedia, and the kernel mounts the IOMedia whose UUID
# matches. A wrong value boots the firmware and then finds no root.
#
# The container UUID in the same superblock (nx_uuid) is NOT this one: it
# matches the synthesized whole-disk IOMedia rather than a volume that mounts.
root_match_volume_uuid = "97A3EB1A-5218-4936-BC85-9574EC2C8CC9"

# Hardware device tree: compiled by the pipeline (real dtc on the cloud
# runner, tools/dtc-mini.py locally) and merged into the ADT by
# devicetree.generate() — cpus with cluster types, psci and the GIC exported
# as /arm-io/intc via unixnu,adt-name. This is what the hand-scaled ADT was
# missing: without /arm-io the kernel dies right after its first console
# line (SecurityLock::LockType) where interrupts and timers get read.
[device_tree]
source = "device:dts/nio.dts"
include_dirs = ["soc:dts"]

[nio_notes]
# 1. A/B slots, active _a: boot_a on sdd, dtbo_a/vendor_boot_a too.
# 2. 6 LUNs; userdata is LUN 4. A LUN selector is a prerequisite for Data.
# 3. ramoops at 0xaf000000 (0xc0000) - our UEFI console window.
# 4. framebuffer at 0x9c000000, 1080x2520, pitch 4320.
# 5. touch is Novatek NT36672C over SPI (GPIO50 reset / GPIO24 irq), not ST FTS.
# 6. keys: Vol+ on gpio-keys, Vol-/Power on PMIC PON.
